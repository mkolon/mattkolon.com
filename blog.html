---
layout: default
title: Ephemera
---
<h1>A Weblog of Ephemera</h1>
<p class="meta" style="margin-bottom: 32px;">Occasional notes, in reverse chronological order.</p>

<ul class="post-index">
  {% for post in site.posts %}
    <li>
      <p class="meta">{{ post.date | date_to_string }}</p>
      <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
      <p>{{ post.excerpt }}</p>
    </li>
  {% endfor %}
</ul>
